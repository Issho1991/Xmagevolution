name: Verify XMage client UI preview
on:
  push:
    branches: [preview/client-ui-01]
    paths:
      - 'previews/client-ui-01/**'
      - '.github/workflows/preview-client-ui.yml'
permissions:
  contents: read
concurrency:
  group: client-ui-preview-01
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Build, regressions, isolation and actual client checks
        run: xvfb-run -a -s '-screen 0 1280x900x24' python3 previews/client-ui-01/build_preview.py --work preview-work --gui
      - name: Keep diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-diagnostics
          path: |
            preview-work/**/*.log
            preview-work/regressions/junit/*.xml
            preview-work/*.png
          retention-days: 14
      - name: Keep the verified preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-ui-preview
          path: |
            preview-work/XMage_Anteprima_Interfaccia_01.zip
            preview-work/preview-verification.json
            preview-work/client-home.png
            preview-work/new-game.png
            preview-work/classic-game.png
          if-no-files-found: error
          retention-days: 14
  windows:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Check isolated preferences and mode commands on Windows
        shell: pwsh
        run: |
          $sources = Get-ChildItem previews/client-ui-01/runner -Recurse -Filter *.java | ForEach-Object { $_.FullName }
          javac --release 8 -encoding UTF-8 -d preview-checks $sources previews/client-ui-01/tests/mage/lab/preview/IsolationChecks.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -Djava.awt.headless=true -cp preview-checks mage.lab.preview.IsolationChecks preview-isolation
          exit $LASTEXITCODE
  publish:
    needs: [build, windows]
    if: github.repository == 'Issho1991/Xmagevolution' && github.ref == 'refs/heads/preview/client-ui-01'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-ui-preview
          path: verified-preview
      - name: Publish a separate immutable prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          folder=pathlib.Path('verified-preview')
          proof=json.loads((folder/'preview-verification.json').read_text())
          assert proof['guiStartupAndProfiles'] and not proof['stableChannelChanged']
          assert proof['regressions']['passed'] >= 147
          assert hashlib.sha256((folder/'XMage_Anteprima_Interfaccia_01.zip').read_bytes()).hexdigest() == proof['packageSha256']
          PY
          tag="ui-preview-01-${GITHUB_SHA:0:12}"
          gh release create "$tag" verified-preview/* --target "$GITHUB_SHA" --prerelease --latest=false --title 'XMage — Anteprima interfaccia 01 (prova separata)' --notes-file previews/client-ui-01/README.md
