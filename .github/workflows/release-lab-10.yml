name: Build and publish Lab 10.0
on:
  # Historical 1.4.62 release: use its original tag for manual reconstruction.
  # Evolving overlays are verified and published by automatic-upstream.yml.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-lab-10
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify pinned release
        run: python3 releases/lab-10.0-ai6/ci.py
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create lab-10.0-ai6 release-work/build/Pacchetto_Lab_10_0_per_Launcher.zip release-work/build/build-summary.json release-work/build/verification-public.json --target "$GITHUB_SHA" --title "XMage Laboratorio 10.0 - base ufficiale 1.4.62" --notes-file releases/lab-10.0-ai6/RELEASE.md
